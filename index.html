<!DOCTYPE html>
<html>
<head>
    <title>Pakistan Clicker 🇵🇰</title>
</head>

<body>

    <h1>🇵🇰 Pakistan Clicker</h1>

    <h2 id="score">0</h2>

    <button onclick="clickPakistan()">CLICK KRO 🇵🇰</button>

    <script>
        let score = 0;

        function clickPakistan() {
            score++;
            document.getElementById("score").innerText = score;
        }
    </script>

</body>
</html>
